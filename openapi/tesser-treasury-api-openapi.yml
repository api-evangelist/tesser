openapi: 3.1.0
info:
  title: Tesser Accounts Treasury API
  description: The Tesser Payments Platform API documentation.
  version: v1
  contact: {}
servers: []
security:
- bearer: []
tags:
- name: Treasury
paths:
  /v1/treasury/activity:
    get:
      operationId: treasury_getTreasuryActivity
      parameters:
      - name: page
        required: true
        in: query
        schema:
          type: number
      - name: limit
        required: true
        in: query
        schema:
          type: number
      - name: account_id
        required: true
        in: query
        schema:
          type: string
      - name: completed_only
        required: false
        in: query
        schema:
          type: boolean
      - name: types
        required: false
        in: query
        description: Filter by activity type
        schema:
          enum:
          - deposit
          - withdrawal
          - rebalance
          type: string
      responses:
        '200':
          description: ''
      security:
      - bearer: []
      summary: Get treasury activity feed (deposits, withdrawals + rebalances)
      tags:
      - Treasury
      x-internal: true
      x-zuplo-route:
        corsPolicy: anything-goes
        handler:
          export: forwardToBackend
          module: $import(./modules/forward-to-backend)
        policies:
          inbound:
          - set-backend-secret-inbound
          - auth0-jwt-auth-inbound
          - forward-user-info-inbound
  /v1/treasury/balances:
    get:
      description: 'Get treasury balances grouped by currency. Each currency includes: available balance from managed accounts, pending review payment amounts, and rejected payment amounts. Optionally filter by specific currencies.'
      operationId: treasury_getTreasuryBalances
      parameters:
      - name: currency
        required: false
        in: query
        description: 'Filter by currency. Comma-separated for multiple values. Example: USDC,USDT'
        schema:
          example: USDC
          type: string
      - name: managed
        required: false
        in: query
        description: Filter by managed status. 'true' for managed accounts only, 'false' for non-managed only, omit for all accounts.
        schema:
          example: 'true'
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreasuryBalancesResponseDto'
        '401':
          description: Authentication required or invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        error_code:
                          type: string
                        error_message:
                          type: string
                      required:
                      - error_code
                      - error_message
                required:
                - errors
                example:
                  errors:
                  - error_code: api-0004
                    error_message: Unauthorized
      security:
      - bearer: []
      summary: Get treasury balances
      tags:
      - Treasury
      x-internal: true
      x-zuplo-route:
        corsPolicy: anything-goes
        handler:
          export: forwardToBackend
          module: $import(./modules/forward-to-backend)
        policies:
          inbound:
          - set-backend-secret-inbound
          - auth0-jwt-auth-inbound
          - forward-user-info-inbound
  /v1/treasury/deposits:
    get:
      description: Retrieve a paginated list of all deposits for the workspace.
      operationId: treasury_getDeposits
      parameters:
      - name: ids
        required: false
        in: query
        description: Filter by deposit IDs (comma-separated UUIDs)
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: to_account_id
        required: false
        in: query
        description: Filter by destination account ID (desired.to.account_id).
        schema:
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          type: string
      - name: page
        required: false
        in: query
        description: Page number for pagination (1-based)
        schema:
          type: integer
          minimum: 1
      - name: limit
        required: false
        in: query
        description: 'Number of items per page (default: 20)'
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Deposits retrieved successfully
