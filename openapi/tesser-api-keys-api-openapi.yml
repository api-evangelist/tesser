openapi: 3.1.0
info:
  title: Tesser Accounts API Keys API
  description: The Tesser Payments Platform API documentation.
  version: v1
  contact: {}
servers: []
security:
- bearer: []
tags:
- name: API Keys
paths:
  /v1/keys:
    post:
      description: Creates an Auth0 M2M application and returns client credentials. Use these credentials to fetch access tokens from Auth0.
      operationId: keys_createApiKey
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequestDto'
      responses:
        '201':
          description: The API key has been successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiKeyResponseDto'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Workspace not found
      security:
      - bearer: []
      summary: Create a new API key
      tags:
      - API Keys
      x-internal: true
      x-zuplo-route:
        corsPolicy: anything-goes
        handler:
          export: forwardToBackend
          module: $import(./modules/forward-to-backend)
        policies:
          inbound:
          - set-backend-secret-inbound
          - auth0-jwt-auth-inbound
          - forward-user-info-inbound
    get:
      operationId: keys_listApiKeys
      parameters: []
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListApiKeysResponseDto'
        '401':
          description: Unauthorized
      security:
      - bearer: []
      summary: List all API keys for the workspace
      tags:
      - API Keys
      x-internal: true
      x-zuplo-route:
        corsPolicy: anything-goes
        handler:
          export: forwardToBackend
          module: $import(./modules/forward-to-backend)
        policies:
          inbound:
          - set-backend-secret-inbound
          - auth0-jwt-auth-inbound
          - forward-user-info-inbound
  /v1/keys/{id}:
    get:
      operationId: keys_getApiKey
      parameters:
      - name: id
        required: true
        in: path
        description: API key ID
        schema:
          type: string
      responses:
        '200':
          description: API key details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyDto'
        '401':
          description: Unauthorized
        '404':
          description: API key not found
      security:
      - bearer: []
      summary: Get a specific API key
      tags:
      - API Keys
      x-internal: true
      x-zuplo-route:
        corsPolicy: anything-goes
        handler:
          export: forwardToBackend
          module: $import(./modules/forward-to-backend)
        policies:
          inbound:
          - set-backend-secret-inbound
          - auth0-jwt-auth-inbound
          - forward-user-info-inbound
    delete:
      operationId: keys_deleteApiKey
      parameters:
      - name: id
        required: true
        in: path
        description: API key ID
        schema:
          type: string
      responses:
        '200':
          description: API key has been deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteApiKeyResponseDto'
        '401':
          description: Unauthorized
        '404':
          description: API key not found
      security:
      - bearer: []
      summary: Delete an API key
      tags:
      - API Keys
      x-internal: true
      x-zuplo-route:
        corsPolicy: anything-goes
        handler:
          export: forwardToBackend
          module: $import(./modules/forward-to-backend)
        policies:
          inbound:
          - set-backend-secret-inbound
          - auth0-jwt-auth-inbound
          - forward-user-info-inbound
  /v1/keys/{id}/revoke:
    put:
      description: Deletes the Auth0 M2M application, instantly invalidating all tokens.
      operationId: keys_revokeApiKey
      parameters:
      - name: id
        required: true
        in: path
        description: API key ID
        schema:
          type: string
      responses:
        '200':
          description: API key has been revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeApiKeyResponseDto'
        '400':
          description: API key is already revoked
        '401':
          description: Unauthorized
        '404':
          description: API key not found
      security:
      - bearer: []
      summary: Revoke an API key
      tags:
      - API Keys
      x-internal: true
      x-zuplo-route:
        corsPolicy: anything-goes
        handler:
          export: forwardToBackend
          module: $import(./modules/forward-to-backend)
        policies:
          inbound:
          - set-backend-secret-inbound
          - auth0-jwt-auth-inbound
          - forward-user-info-inbound
