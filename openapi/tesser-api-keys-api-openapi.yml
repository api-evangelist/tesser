    RevokeApiKeyResponseDto:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            apiKey:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                name:
                  type: string
                description:
                  type: string
                  nullable: true
                maskedClientId:
                  type: string
                status:
                  type: string
                  enum:
