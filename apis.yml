aid: tesser
name: Tesser
description: >-
  Tesser is a New York-based stablecoin payments infrastructure company that lets
  licensed financial institutions, banks, fintechs, and payment service providers
  move money across borders instantly and compliantly on modern stablecoin rails.
  Its full-stack platform handles wallet provisioning, treasury management,
  compliance orchestration, and reconciliation, letting institutions integrate
  stablecoin payments in under a month. The Tesser API (OpenAPI 3.1, v1) exposes
  accounts, counterparties, tenants, payments, and treasury operations (deposits,
  withdrawals, rebalances) secured with Auth0 client-credentials JWTs, plus
  Ed25519-signed webhooks, first-party TypeScript and Kotlin signer SDKs, a
  published Model Context Protocol server, and an open-source agentic onboarding
  skill. Founded by Geetha Panchapakesan (ex-MoneyGram, Visa Direct, Circle);
  raised a $4.5M seed in October 2025 led by Castle Island Ventures with Anthemis,
  Strobe Ventures, and Digital Currency Group.
